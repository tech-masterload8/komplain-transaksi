# Pakai file ini jika network_mode: host tidak tersedia
# (Docker Desktop Windows/macOS). Ubah OTOMAX_DB_HOST dan APP_DB_HOST
# di .env menjadi host.docker.internal.

services:
  komplain:
    image: ghcr.io/tech-masterload8/komplain-transaksi:latest
    pull_policy: always
    container_name: komplain-transaksi
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/komplain}
      OTOMAX_DB_HOST: ${OTOMAX_DB_HOST:-host.docker.internal}
      APP_DB_HOST: ${APP_DB_HOST:-host.docker.internal}
    volumes:
      - komplain_uploads:/app/public/uploads

volumes:
  komplain_uploads:
