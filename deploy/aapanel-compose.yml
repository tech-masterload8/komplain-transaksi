# Image dibangun di GitHub Actions, bukan di server.
# Setelah push ke main, tunggu workflow GHCR selesai, lalu di aaPanel: Pull + Recreate.
# Image: ghcr.io/tech-masterload8/komplain-transaksi:latest
#
# Kali pertama: GitHub → Packages → komplain-transaksi → Package settings → Public
# (repo sudah public; package GHCR default-nya private).

services:
  komplain:
    image: ghcr.io/tech-masterload8/komplain-transaksi:latest
    pull_policy: always
    container_name: komplain-transaksi
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_BASE_PATH: /komplain
      ALLOW_DEV_LOGIN: "false"
    volumes:
      - komplain_uploads:/app/public/uploads

volumes:
  komplain_uploads:
