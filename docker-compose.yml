# Default untuk aaPanel: jaringan host agar 127.0.0.1 di .env
# tetap mengenai PostgreSQL yang sudah jalan di server.
# Port aplikasi = PORT di .env (default 3001; 3000 sudah terpakai monitoring). Nginx aaPanel proxy ke port itu.

services:
  komplain:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/komplain}
    image: komplain-transaksi:latest
    container_name: komplain-transaksi
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/komplain}
    volumes:
      - komplain_uploads:/app/public/uploads

volumes:
  komplain_uploads:
